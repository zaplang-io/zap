[package]
name = "zapc_sema"
description = "Zap semantic analysis: types and the type checker."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zapc_sema"
path = "src/lib.rs"

[dependencies]
zapc_syntax = { path = "../syntax" }
# Source-level type model lives in its own leaf crate (#129) so edits to the
# `Checker` don't recompile it; re-exported (`Ty`) from `lib.rs`.
zapc_sema_types = { path = "../sema_types" }
