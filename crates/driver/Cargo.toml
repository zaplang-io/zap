[package]
name = "zapc"
description = "The Zap compiler driver (CLI)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zapc"
path = "src/main.rs"

[dependencies]
zapc_syntax = { path = "../syntax" }
zapc_sema = { path = "../sema" }
zapc_ir = { path = "../ir" }
# Codegen needs LLVM; gated behind the `llvm` feature so the driver builds
# without LLVM on hosts that lack it.
zapc_codegen = { path = "../codegen", optional = true }

[features]
llvm = ["dep:zapc_codegen"]
