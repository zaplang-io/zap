# Zap compiler workspace.
#
# Phase 0 scaffold: data-structure crates + a driver stub. The lexer, parser,
# type checker and codegen land in later phases (see ROADMAP.md).
[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/syntax",
    "crates/sema_types",
    "crates/sema",
    "crates/analysis",
    "crates/ir_core",
    "crates/mono",
    "crates/ir",
    "crates/codegen",
    "crates/fmt",
    "crates/pkg",
    "crates/driver",
]
# Codegen needs LLVM, which isn't available on every host (e.g. Intel macOS).
# It is excluded from the default build so `cargo build`/`test` work without
# LLVM; build it explicitly (in the dev container) with `--features zapc/llvm`
# or `-p zapc_codegen`.
default-members = [
    "crates/diag",
    "crates/syntax",
    "crates/sema_types",
    "crates/sema",
    "crates/analysis",
    "crates/ir_core",
    "crates/mono",
    "crates/ir",
    "crates/fmt",
    "crates/pkg",
    "crates/driver",
]

[workspace.package]
# Single SemVer 2.0.0 version for the whole `zap` toolchain; bump rules and the
# surface tiers it covers are defined in docs/STABILITY.md (D-0070). 0.x makes no
# compatibility promise.
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
