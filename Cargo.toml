# Zap compiler workspace.
#
# Phase 0 scaffold: data-structure crates + a driver stub. The lexer, parser,
# type checker and codegen land in later phases (see ROADMAP.md).
[workspace]
resolver = "2"
members = [
    "crates/syntax",
    "crates/sema",
    "crates/codegen",
    "crates/driver",
]
# Codegen needs LLVM, which isn't available on every host (e.g. Intel macOS).
# It is excluded from the default build so `cargo build`/`test` work without
# LLVM; build it explicitly (in the dev container) with `--features zapc/llvm`
# or `-p zapc_codegen`.
default-members = [
    "crates/syntax",
    "crates/sema",
    "crates/driver",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"
