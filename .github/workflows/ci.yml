name: CI

# Build and test every push and pull request, both on a plain host (front-end
# crates, no LLVM) and in a full environment that mirrors the LLVM 18 dev
# container (.devcontainer/Dockerfile) so codegen and the golden end-to-end
# tests run too.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Change detection (ticket: CI path filtering for doc-only PRs). Cheap,
  # always-run, no LLVM. Decides whether this change touches *code* (=> run the
  # full matrix) or is *docs-only* (=> skip the heavy jobs). Everything downstream
  # gates on `outputs.code`. FAIL SAFE: any ambiguity, missing ref, or error
  # defaults to code=true, so we never skip real CI by mistake.
  #
  # Self-contained git-diff script (no external action) so the push/PR ref logic
  # and the zero-before-SHA edge case are explicit and auditable:
  #   * pull_request -> diff against the PR base SHA.
  #   * push         -> diff against github.event.before; the all-zeros before-SHA
  #                     (branch creation / first push) is treated as code=true;
  #                     an unusable before-SHA falls back to HEAD~1, else code=true.
  # A change is docs-only (code=false) iff EVERY changed path is a doc path.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base / before SHAs are present for the diff.
          fetch-depth: 0

      - name: Detect code vs docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # No `set -e`: we handle every failure explicitly and fail safe to code=true.
          set -uo pipefail

          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "Decision: code=$1"; }

          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$base" HEAD)"
            else
              echo "PR base SHA unavailable ($base); fail safe."; emit true; exit 0
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE"
            zero="0000000000000000000000000000000000000000"
            if [ -z "$before" ] || [ "$before" = "$zero" ]; then
              echo "Initial push / zero before-SHA; fail safe."; emit true; exit 0
            elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$before" HEAD)"
            elif git rev-parse HEAD~1 >/dev/null 2>&1; then
              echo "before-SHA $before not fetched; falling back to HEAD~1."
              files="$(git diff --name-only HEAD~1 HEAD)"
            else
              echo "No usable before-SHA or HEAD~1; fail safe."; emit true; exit 0
            fi
          else
            echo "Unknown event $EVENT_NAME; fail safe."; emit true; exit 0
          fi

          echo "Changed files:"; printf '%s\n' "$files"

          if [ -z "$files" ]; then
            echo "No changed files detected; treating as docs-only."; emit false; exit 0
          fi

          # Docs paths (safe to skip heavy CI). `case` patterns match '/' with '*',
          # so `*.md` covers **/*.md (incl. editors/**/*.md) and `docs/*` covers
          # docs/**. ANY path that is not a doc path flips the whole change to code.
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) ;;
              docs/*) ;;
              design/*) ;;
              LICENSE*) ;;
              .github/ISSUE_TEMPLATE/*) ;;
              *) echo "code path: $f"; code=true ;;
            esac
          done <<< "$files"

          emit "$code"

  # Fast path: the default members only (no LLVM). Mirrors what `cargo test`
  # does on a host without LLVM (e.g. Intel macOS); keeps that path green.
  host:
    name: host (no LLVM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel (1.99.1); install it with the
      # components we need. The pinned toolchain is picked up automatically by
      # every subsequent cargo/rustup invocation.
      # `rustup toolchain install` with no argument installs the toolchain
      # pinned in rust-toolchain.toml (1.99.1), with its declared components
      # (rustfmt, clippy). rustup 1.28+ no longer auto-installs, so be explicit.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default members)
        run: cargo test

      # Zap fmt gate (D-0037, #227): every `.zap` source must be in canonical
      # form. `zap fmt` is host-safe (no LLVM), so it runs here. Fix locally
      # with `cargo run --bin zap -- fmt tests/golden`.
      - name: Zap fmt check
        run: cargo run -q --bin zap -- fmt --check tests/golden

  # VS Code extension (ticket #231, tooling epic #157 / Area B). The editor
  # client is Node/TypeScript and lives entirely outside the Cargo workspace
  # (editors/vscode/), so it is never touched by the Rust jobs above. This job
  # is purely additive — it type-checks the extension, runs the TextMate grammar
  # tokenizer smoke test, and proves `vsce package` produces a .vsix. No LLVM, so
  # it is cheap and host-only.
  vscode-extension:
    name: vscode extension (Node/TS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile
        run: npm run compile

      - name: TextMate grammar tokenizer test
        run: npm test

      - name: Package .vsix
        run: npx @vscode/vsce package --out zap-lang.vsix

  # Full path: replicate the dev container inline — install the same LLVM 18
  # packages as .devcontainer/Dockerfile, then build and test the whole
  # workspace with codegen enabled (includes the golden end-to-end:
  # fib=55, loop_sum=45, hello).
  full:
    name: full (LLVM 18 + codegen)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Where llvm-sys / inkwell (llvm18-0) find LLVM 18. Matches the Dockerfile.
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      # Link Rust's own binaries with mold (ticket #128): a fraction of GNU ld's
      # RAM at the link peak and much faster, matching the dev container. Scoped
      # to the Linux target so it only applies here; gcc 12+ drives `-fuse-ld`.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      # Same LLVM 18 toolchain and system libraries llvm-sys links against as
      # .devcontainer/Dockerfile, plus mold (the link-step linker, see env
      # above). (build-essential, curl and git are already on the runner.)
      - name: Install LLVM 18 and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18 \
            llvm-18-dev \
            libpolly-18-dev \
            clang-18 \
            libclang-18-dev \
            libgc-dev \
            libpcre2-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libncurses-dev \
            mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full

      - name: Format check
        run: cargo fmt --all -- --check

      # Default collector: the precise Immix GC (ticket #116). This is now the
      # primary codegen suite — the same golden end-to-end path plus the
      # GC-specific reclamation tests (tests/gc.rs).
      - name: "Clippy (default: precise Immix GC)"
        run: cargo clippy --workspace --features zapc/gc-immix --all-targets -- -D warnings

      # Fallback collector: the conservative Boehm GC (`-lgc`), kept covered as
      # the secondary suite. Folded into the `full` check so the two-check CI
      # contract (host + full) is unchanged.
      - name: "Clippy (fallback: Boehm GC)"
        run: cargo clippy --workspace --features zapc/gc-boehm --all-targets -- -D warnings

      - name: "Test (default: precise Immix GC)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC)"
        run: cargo test --workspace --features zapc/gc-boehm

  # ARM-Linux (aarch64) validation (ticket #204, platform epic #158 / C2). The
  # same codegen + golden end-to-end suite as `full`, run natively on a GitHub-
  # hosted arm64 runner (no emulation: the runtime's ucontext coroutine switch,
  # SIGURG preemption and epoll netpoller must be exercised on real aarch64
  # hardware, and QEMU-user cannot faithfully emulate swapcontext-from-signal-
  # handler). Both collectors, mirroring `full`. Clippy/fmt stay on x86 (`host`
  # and `full` already gate them; they are target-independent).
  arm64:
    name: arm64 (aarch64 Linux + codegen)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if the runner label ever silently resolves to x86-64, which
      # would turn this job into a duplicate of `full`.
      - name: Assert aarch64 host
        run: |
          test "$(uname -m)" = aarch64

      - name: Install LLVM 18 and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18 \
            llvm-18-dev \
            libpolly-18-dev \
            clang-18 \
            libclang-18-dev \
            libgc-dev \
            libpcre2-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libncurses-dev \
            mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64

      - name: "Test (default: precise Immix GC)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC)"
        run: cargo test --workspace --features zapc/gc-boehm

  # macOS (ticket #224, platform epic #158 / macOS Area). REQUIRED. The macOS
  # milestone: the C runtime (`zaprt.c`) compiles and LINKS on macOS and a Zap
  # *program* runs, with the netpoller on the new kqueue backend. macOS is POSIX +
  # the Itanium C++ ABI, so it reuses the Linux POSIX paths (NOT the Windows seams)
  # — the whole full+golden suite runs here under BOTH collectors, like `full`.
  #
  # Arch = x86_64 on `macos-13` (Intel), DELIBERATELY (design/0033, D-0081): the
  # macos-latest runners are arm64 (Apple Silicon), and I#223 is a parked
  # aarch64-ONLY weak-memory bug in the precise-Immix multicore path — its finding
  # proves x86_64 is clean (0/120 at MAXPROCS 4/8/16) while arm64 fails ~97%. Intel
  # shares Linux's memory model, so this gate is green and genuinely exercises the
  # multicore GC. The arm64 macOS job below stays best-effort (MAXPROCS=1) until
  # I#223 lands, so #223 does NOT block landing macOS support.
  macos:
    name: "macOS (x86_64 + codegen)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-13
    env:
      # llvm-sys / inkwell (llvm18-0) find LLVM 18 via Homebrew's keg.
      LLVM_SYS_180_PREFIX: /usr/local/opt/llvm@18
      LLVM_SYS_181_PREFIX: /usr/local/opt/llvm@18
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if the runner ever silently resolves to arm64 (which would turn
      # this required job into an I#223-affected flake factory).
      - name: Assert x86_64 host
        run: test "$(uname -m)" = x86_64

      # The link-time runtime deps build_executable's POSIX arm needs
      # (`-lpcre2-8 -lz -lssl -lcrypto -lc++` + CPython embed via pkg-config), the
      # Boehm collector (`-lgc`, for the gc-boehm suite), and LLVM 18 for codegen.
      # zlib + libc++ ship with the SDK; the rest come from Homebrew.
      - name: Install LLVM 18 and runtime libraries (Homebrew)
        run: |
          brew install llvm@18 pcre2 openssl@3 bdw-gc pkg-config python@3.12

      # Export the Homebrew prefixes so `cc` (the linker driver) and `pkg-config`
      # find the keg-only libraries regardless of the Intel/arm prefix. openssl is
      # keg-only, so its pkgconfig + lib/include dirs are added explicitly.
      - name: Configure Homebrew library/include/pkg-config paths
        run: |
          set -eux
          BREW="$(brew --prefix)"
          OPENSSL="$(brew --prefix openssl@3)"
          GC="$(brew --prefix bdw-gc)"
          PY="$(brew --prefix python@3.12)"
          echo "LIBRARY_PATH=${BREW}/lib:${OPENSSL}/lib:${GC}/lib" >> "$GITHUB_ENV"
          echo "CPATH=${BREW}/include:${OPENSSL}/include:${GC}/include" >> "$GITHUB_ENV"
          # openssl is keg-only; python@3.12 ships python3-embed.pc in its keg.
          echo "PKG_CONFIG_PATH=${OPENSSL}/lib/pkgconfig:${PY}/lib/pkgconfig:${BREW}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      # Fast, LLVM-free pre-check: the standalone kqueue netpoller harness
      # (`zap_np_kqueue_test.c`) links the REAL runtime (`zaprt.c`) and drives the
      # in-runtime park/wake + deadline self-test through the kqueue backend + the
      # ucontext context switch, under BOTH collectors — the on-macOS analogue of
      # the Windows A2 harness. Fails fast before the full suite if the backend or
      # the ctx-switch seam regresses.
      - name: "kqueue netpoller harness (immix + boehm)"
        run: |
          set -eux
          cd crates/codegen/src
          PYFLAGS="$(pkg-config --cflags --libs python3-embed)"
          cc -std=c11 -DZAP_GC_IMMIX zap_np_kqueue_test.c zaprt.c -o /tmp/kqnp_immix \
            $PYFLAGS -lc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread
          /tmp/kqnp_immix
          cc -std=c11 zap_np_kqueue_test.c zaprt.c -o /tmp/kqnp_boehm \
            $PYFLAGS -lc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread -lgc
          /tmp/kqnp_boehm

      - name: Format check
        run: cargo fmt --all -- --check

      - name: "Clippy (default: precise Immix GC)"
        run: cargo clippy --workspace --features zapc/gc-immix --all-targets -- -D warnings

      - name: "Clippy (fallback: Boehm GC)"
        run: cargo clippy --workspace --features zapc/gc-boehm --all-targets -- -D warnings

      - name: "Test (default: precise Immix GC)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC)"
        run: cargo test --workspace --features zapc/gc-boehm

  # macOS on Apple Silicon (ticket #224). BEST-EFFORT (`continue-on-error: true`)
  # until I#223 (the aarch64 multicore-GC weak-memory bug) lands: the suite runs
  # with `MAXPROCS=1` so the known-good single-worker path is exercised on arm64
  # macOS — proving codegen, the ucontext switch, the kqueue netpoller and signals
  # work on Apple Silicon — while the #223 multicore race is quarantined (a
  # non-pinned arm64 run would be ~97% red and carry no signal). It surfaces any
  # NON-#223 arm64-macOS regression without gating the merge; promoting it to
  # required (multi-worker) is the follow-up that lands with the I#223 fix.
  macos-arm64:
    name: "macOS (arm64, best-effort / MAXPROCS=1)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    continue-on-error: true
    env:
      LLVM_SYS_180_PREFIX: /opt/homebrew/opt/llvm@18
      LLVM_SYS_181_PREFIX: /opt/homebrew/opt/llvm@18
      # Single worker M: avoids the parked I#223 multicore precise-Immix race while
      # still exercising the full codegen/runtime path on Apple Silicon.
      MAXPROCS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Assert arm64 host
        run: test "$(uname -m)" = arm64

      - name: Install LLVM 18 and runtime libraries (Homebrew)
        run: |
          brew install llvm@18 pcre2 openssl@3 bdw-gc pkg-config python@3.12

      - name: Configure Homebrew library/include/pkg-config paths
        run: |
          set -eux
          BREW="$(brew --prefix)"
          OPENSSL="$(brew --prefix openssl@3)"
          GC="$(brew --prefix bdw-gc)"
          PY="$(brew --prefix python@3.12)"
          echo "LIBRARY_PATH=${BREW}/lib:${OPENSSL}/lib:${GC}/lib" >> "$GITHUB_ENV"
          echo "CPATH=${BREW}/include:${OPENSSL}/include:${GC}/include" >> "$GITHUB_ENV"
          # openssl is keg-only; python@3.12 ships python3-embed.pc in its keg.
          echo "PKG_CONFIG_PATH=${OPENSSL}/lib/pkgconfig:${PY}/lib/pkgconfig:${BREW}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-arm64

      - name: "kqueue netpoller harness (immix + boehm)"
        run: |
          set -eux
          cd crates/codegen/src
          PYFLAGS="$(pkg-config --cflags --libs python3-embed)"
          cc -std=c11 -DZAP_GC_IMMIX zap_np_kqueue_test.c zaprt.c -o /tmp/kqnp_immix \
            $PYFLAGS -lc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread
          /tmp/kqnp_immix
          cc -std=c11 zap_np_kqueue_test.c zaprt.c -o /tmp/kqnp_boehm \
            $PYFLAGS -lc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread -lgc
          /tmp/kqnp_boehm

      - name: "Test (default: precise Immix GC, MAXPROCS=1)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC, MAXPROCS=1)"
        run: cargo test --workspace --features zapc/gc-boehm

  # Windows coroutine context switch (ticket #195, platform epic #158 / Area A1).
  # REQUIRED (no `continue-on-error`): unlike the broader `windows` job below —
  # which stays non-blocking because a full Zap *program* cannot link on Windows
  # until A4 (#198, fs/process/sockets) lands — the A1 context switch itself
  # is complete and verifiable TODAY, in isolation from the unported subsystems.
  # This job builds and runs the standalone verification harness
  # (`crates/codegen/src/zap_ctx_win_x64_test.c`, which pulls in the shipping asm
  # backend `zap_ctx_win_x64.c`) on a native windows-latest runner and asserts:
  #   1. a coroutine switches in/out faithfully across many round-trips,
  #      preserving the full Windows x64 nonvolatile set — callee-saved GPRs AND
  #      XMM6-XMM15 (the Windows delta over System V) — and its own stack; and
  #   2. under the conservative `gc-boehm` collector, a *suspended* coroutine's
  #      heap root (reachable only via a pointer on its green stack and in a
  #      spilled callee-saved register) survives collections that run while it is
  #      parked — the load-bearing GC invariant native Fibers would have broken
  #      (design/0017). This is the on-Windows GC check the spike could not run.
  # The precise `gc-immix` collector cannot be exercised by THIS standalone A1
  # harness (its roots come from compiler-emitted shadow-stack code, which a
  # hand-written C harness does not carry). Its aligned-block heap now builds and
  # runs on Windows (I#218) and is exercised on the `windows-runtime` job below;
  # immix's parked-coroutine invariant is proven behavior-neutral through this
  # same seam by the gc-immix goldens on the required Linux/ARM jobs
  # (gc_parked_coroutine, immix_evac_coro_stress, ...).
  windows-ctxswitch:
    name: "Windows coroutine context switch (I#195 / A1)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 / MinGW-w64 is the A5-chosen Windows toolchain (design/0017,0018).
      # Pull in gcc and the thread-aware Boehm GC (`mingw-w64-x86_64-gc`) so the
      # gc-boehm invariant test links `-lgc`. Pinned, no full-system update, to
      # keep the job fast and deterministic.
      - name: Set up MSYS2 / MinGW-w64 + Boehm GC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc

      # (1) Context switch + full nonvolatile (GPR + XMM6-15) + stack preservation.
      # No external deps; pure MinGW gcc. REQUIRED.
      - name: Context switch — control flow + nonvolatile preservation
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall zap_ctx_win_x64_test.c -o ctxtest.exe
          ./ctxtest.exe

      # (2) THE critical A1 GC verification: parked-coroutine heap root survives
      # collection under the conservative Boehm collector. REQUIRED.
      - name: Context switch — gc-boehm parked-coroutine root survival
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall -DZAP_CTX_TEST_BOEHM zap_ctx_win_x64_test.c -lgc -o ctxtest_gc.exe
          ./ctxtest_gc.exe

  # Windows signals / preemption / faults (ticket #197, platform epic #158 /
  # Area A3). REQUIRED (no `continue-on-error`), same rationale as
  # `windows-ctxswitch`: a full Zap *program* cannot link on Windows until A2
  # (#196) and A4 (#198) also compile (zaprt.c is one translation unit), but the
  # A3 MECHANISMS are complete and verifiable TODAY in isolation. This job builds
  # and runs the standalone harness (`zap_win_a3_test.cc`, which pulls in the
  # shipping backends `zap_win_a3.c` + the A1 `zap_ctx_win_x64.c`) on a native
  # windows-latest runner and asserts, under MinGW-w64 (the gc-boehm Windows v1
  # toolchain):
  #   T1. a C++ (SEH) exception is thrown and caught across frames living on a
  #       hand-switched green stack — the critical A1xA3 interaction (SEH consults
  #       the TIB stack bounds the A1 switch installs). g++ lowers try/throw/catch
  #       to exactly the __gxx_personality_seh0 + __cxa_* SEH model Zap codegen now
  #       targets.
  #   T2. the boehm preemption HIJACK (SuspendThread + Get/SetThreadContext) is
  #       control-flow- and register-faithful across many injections.
  #   T3. the bdwgc-STW x monitor SuspendThread race (ticket #197 Q5) is closed by
  #       mutex serialization under heavy stress (no deadlock, no corruption).
  #   T4. the last-chance fault filter reports type/address/coroutine + a dbghelp
  #       backtrace and lets the process die (run in a child, like I#77).
  #   T5. console control events map to the Signal enum's reachable subset.
  # The precise gc-immix collector is not exercised by this A3-isolated harness;
  # its flag-at-safepoint preempt path is collector-agnostic and proven
  # behavior-neutral by the gc-immix goldens on Linux/ARM. (The immix heap itself
  # now builds and runs on Windows, I#218 — see the `windows-runtime` job.)
  windows-a3:
    name: "Windows signals / preemption / faults (I#197 / A3)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 g++ (C++ for the SEH exception proxy) + the thread-aware Boehm
      # GC is not needed here (the harness uses plain malloc'd green stacks — the
      # GC-ownership invariant is A1's job, covered by windows-ctxswitch); dbghelp
      # ships with MinGW-w64.
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: A3 primitives — SEH/green-stack, hijack, Q5 stress, fault, signals
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          g++ -O2 -Wall zap_win_a3_test.cc -ldbghelp -o a3test.exe
          ./a3test.exe

  # Windows IOCP netpoller backend (ticket #196, platform epic #158 / Area A2).
  # REQUIRED (no `continue-on-error`), same rationale as `windows-ctxswitch` /
  # `windows-a3`: a full Zap *program* cannot link on Windows until A4 (#198) also
  # compiles (zaprt.c is one translation unit), but the A2 MECHANISM is complete and
  # verifiable TODAY in isolation. This job builds and runs the standalone harness
  # (`zap_np_iocp_test.c`, which links the shipping backend `zap_np_iocp.c`) on a
  # native windows-latest runner under MinGW-w64 and asserts, over a raw-Winsock
  # loopback socket pair (NOT the Zap net module — A4 is out of A2 scope):
  #   T1. an armed AFD READ poll times out while the socket is not readable and
  #       completes (right userkey + readable) once the peer sends — the
  #       IOCP-completion -> readiness bridge the design rests on.
  #   T2. the park/wake round-trip: a waiter parked on a condvar is woken by a
  #       completion the real zap_iocp_wait poller loop delivers (the copark/coready
  #       analogue).
  #   T3. the PostQueuedCompletionStatus kick (`zap_iocp_kick`) promptly unblocks a
  #       poller parked in zap_iocp_wait (the eventfd/self-pipe-kick equivalent).
  #   T4. tearing down a descriptor with an in-flight poll (CancelIoEx) and reaping
  #       the cancelled completion does not leak or crash.
  # The precise gc-immix collector is not exercised by this A2-isolated harness;
  # the netpoller is collector-agnostic and its full copark/coready + latch +
  # deadline logic is proven behavior-neutral by the `netpoller.zap` golden on the
  # required Linux/ARM jobs under both collectors. (The immix heap itself now
  # builds and runs on Windows, I#218 — see the `windows-runtime` job.)
  windows-netpoller:
    name: "Windows IOCP netpoller (I#196 / A2)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 gcc only: the harness needs Winsock (`-lws2_32`, preinstalled)
      # and resolves the ntdll AFD entry points at runtime (no `-lntdll`). The
      # thread-aware Boehm GC is not needed here — the harness uses Win32 threads
      # and the netpoller allocates no GC memory (the GC-ownership invariant is
      # A1's job, covered by `windows-ctxswitch`).
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: A2 netpoller — AFD readiness, park/wake, kick, teardown
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall zap_np_iocp_test.c zap_np_iocp.c -lws2_32 -o nptest.exe
          ./nptest.exe

  # Windows full-program runtime (ticket #198, platform epic #158 / Area A4).
  # REQUIRED (no `continue-on-error`) — the A4 payoff and the Windows milestone:
  # the C runtime (`crates/codegen/src/zaprt.c`, one translation unit) now compiles
  # and LINKS on Windows, so a Zap *program* can run. With A1 (#195 context switch),
  # A2 (#196 IOCP netpoller), A3 (#197 signals/preempt/faults) and A4 (fs/process/
  # env/sockets/random) all landed, this job builds the shipping runtime TUs plus
  # an integration harness against the real MinGW-w64 / MSYS2 runtime libraries
  # (gc/pcre2/zlib/openssl + Winsock/BCrypt/DbgHelp — CPython is gated off for v1)
  # on a native windows-latest runner, and RUNS it — under BOTH collectors: the
  # conservative Boehm GC (the Windows v1 fallback) AND the precise Immix GC (Zap's
  # DEFAULT), whose aligned-block heap now builds on Windows via I#218's
  # `_aligned_malloc`/`_aligned_free` seam. The gc-immix build is the proof the
  # port works: it compiles zaprt.c with -DZAP_GC_IMMIX (which `#include`s
  # zapgc.inc.c) and runs the harness, exercising the Immix allocator's
  # mutator registration, block map, bump allocation and safepoint/STW wiring
  # under a real multi-subsystem program on a real Windows runner. (A C harness
  # carries no compiler-emitted shadow-stack roots, so it deliberately does NOT
  # drive a collection; the sweep + large-object reclamation paths are compile-
  # checked here and behaviorally proven by the ROOTED Zap-source gc-immix goldens
  # on the required Linux/ARM jobs — gc_large_live_set, immix_evac_coro_stress.)
  # The harness (`zap_win_a4_test.c`) drives the public runtime ABI end-to-end — byte-exact
  # fs/io, os/env, the Path::join separator fix, the BCryptGenRandom CSPRNG, an
  # ephemeral Winsock listener with IOCP/AFD netpoller registration, and a
  # coroutine spawned on the M:N scheduler sending over a channel to the main
  # thread (the A1 context switch running a real program under the scheduler). The
  # Zap-*source* goldens additionally run once the LLVM-18-backed compiler is built
  # on Windows (tracked separately — see the PR body); until then this C harness is
  # the on-Windows proof for the Immix allocator. The portable front-end crates
  # still build+test best-effort in `windows-crates`.
  windows-runtime:
    name: "Windows full-program runtime (I#198 / A4)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 / MinGW-w64 is the A5-chosen Windows toolchain. Install gcc/g++ and
      # the runtime libraries the full program link needs — the thread-aware Boehm
      # GC (`-lgc`), PCRE2 (`-lpcre2-8`), zlib (`-lz`) and OpenSSL (`-lssl
      # -lcrypto`); Winsock (`-lws2_32`), BCrypt (`-lbcrypt`) and DbgHelp
      # (`-ldbghelp`) ship with MinGW-w64. These are the exact `-l` names
      # build_executable's Windows arm uses.
      - name: Set up MSYS2 / MinGW-w64 + runtime libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl

      # Compile + link the shipping runtime (zaprt.c + the A1/A2/A3 Windows TUs)
      # with the A4 integration harness, exactly as build_executable's Windows arm
      # links a program (minus CPython, gated off for v1), under gc-boehm. This is
      # the proof that zaprt.c COMPILES and LINKS on Windows (the former #error gate
      # that blocked ZAP_GC_IMMIX on Windows is retired by I#218).
      - name: Build the runtime + A4 integration harness (gc-boehm)
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall -o a4test.exe \
            zap_win_a4_test.c zaprt.c zap_ctx_win_x64.c zap_win_a3.c zap_np_iocp.c \
            -lstdc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread -lgc \
            -lws2_32 -lbcrypt -ldbghelp

      # Run it: byte-exact fs, env, path_join, CSPRNG, a Winsock listener, and a
      # coroutine/channel round-trip through the scheduler — Zap's runtime running
      # on Windows. Non-zero exit (a failed check or an uncaught runtime fault)
      # fails the job.
      - name: Run the A4 integration harness (gc-boehm)
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          ./a4test.exe

      # Same build + run under the DEFAULT precise Immix collector (I#218): add
      # -DZAP_GC_IMMIX (which `#include`s zapgc.inc.c at the bottom of zaprt.c) and
      # DROP -lgc (the precise collector links no Boehm), exactly as
      # build_executable's `gc-immix` arm does; -lpthread stays (winpthreads backs
      # the heap/STW locks). This is the proof the Windows aligned-block heap port
      # works: the `_aligned_malloc` block map + bump allocation and the
      # safepoint/STW wiring run under a real program on a real Windows runner (the
      # `_aligned_free`/sweep/LOS paths are compile-checked here and reclamation-
      # proven by the rooted gc-immix goldens on Linux/ARM — see the job header).
      # The default collector reaching Windows parity with Linux/macOS.
      - name: Build the runtime + A4 integration harness (gc-immix, DEFAULT)
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall -DZAP_GC_IMMIX -o a4test_immix.exe \
            zap_win_a4_test.c zaprt.c zap_ctx_win_x64.c zap_win_a3.c zap_np_iocp.c \
            -lstdc++ -lm -lpcre2-8 -lz -lssl -lcrypto -lpthread \
            -lws2_32 -lbcrypt -ldbghelp

      - name: Run the A4 integration harness (gc-immix, DEFAULT)
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          ./a4test_immix.exe

  # Windows front-end crates (ticket #199 / A5). BEST-EFFORT (`continue-on-error`):
  # the portable compiler crates (syntax/sema/ir/mono/pkg/driver; no LLVM, no C
  # runtime link) build and test on a native Windows host. The A4 Path::join
  # separator fix (zenv module paths join with '/') lands with this PR; the test
  # step stays non-fatal because the LLVM-18-backed codegen/link path is not built
  # here (that is the `windows-runtime` job + the tracked Zap-source golden
  # follow-up), so codegen-dependent tests cannot run on this host yet.
  windows-crates:
    name: "Windows front-end crates (I#199 / A5)"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Build (default members, no LLVM)
        run: cargo build

      - name: Test (default members, no LLVM)
        continue-on-error: true
        run: cargo test

  # Aggregate status gate. THIS is the single required status check for `main`
  # (branch-protection ruleset), replacing the per-matrix contexts. It runs on
  # BOTH triggers, is never path-gated (always reports a status), and depends on
  # every heavy job plus `changes`. `if: always()` makes it run even when a
  # dependency was skipped (docs-only) or failed.
  #
  # Pass/fail rule: GREEN when every needed job is `success` OR `skipped`; RED if
  # any is `failure` or `cancelled`. So a docs-only change (heavy jobs skipped) is
  # green, and a code change is green only when the whole matrix passed. This is
  # the standard pattern that avoids the GitHub footgun where a *skipped* required
  # matrix check would block merge forever.
  #
  # `windows-crates` is intentionally NOT a dependency: it is best-effort
  # (`continue-on-error: true`) and must stay non-blocking, so it is excluded from
  # the gate rather than being allowed to turn the gate red.
  ci-gate:
    name: CI gate
    needs:
      - changes
      - host
      - vscode-extension
      - full
      - arm64
      - windows-ctxswitch
      - windows-a3
      - windows-netpoller
      - windows-runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded or were skipped
        run: |
          set -u
          echo "changes:           ${{ needs.changes.result }}"
          echo "host:              ${{ needs.host.result }}"
          echo "vscode-extension:  ${{ needs.vscode-extension.result }}"
          echo "full:              ${{ needs.full.result }}"
          echo "arm64:             ${{ needs.arm64.result }}"
          echo "windows-ctxswitch: ${{ needs.windows-ctxswitch.result }}"
          echo "windows-a3:        ${{ needs.windows-a3.result }}"
          echo "windows-netpoller: ${{ needs.windows-netpoller.result }}"
          echo "windows-runtime:   ${{ needs.windows-runtime.result }}"
          bad="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$bad" = "true" ]; then
            echo "::error::A required job failed or was cancelled — CI gate is RED."
            exit 1
          fi
          echo "All required jobs succeeded or were skipped — CI gate is GREEN."
