name: CI

# Build and test every push and pull request, both on a plain host (front-end
# crates, no LLVM) and in a full environment that mirrors the LLVM 18 dev
# container (.devcontainer/Dockerfile) so codegen and the golden end-to-end
# tests run too.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast path: the default members only (no LLVM). Mirrors what `cargo test`
  # does on a host without LLVM (e.g. Intel macOS); keeps that path green.
  host:
    name: host (no LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel (1.99.1); install it with the
      # components we need. The pinned toolchain is picked up automatically by
      # every subsequent cargo/rustup invocation.
      # `rustup toolchain install` with no argument installs the toolchain
      # pinned in rust-toolchain.toml (1.99.1), with its declared components
      # (rustfmt, clippy). rustup 1.28+ no longer auto-installs, so be explicit.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default members)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (default members)
        run: cargo test

  # Full path: replicate the dev container inline — install the same LLVM 18
  # packages as .devcontainer/Dockerfile, then build and test the whole
  # workspace with codegen enabled (includes the golden end-to-end:
  # fib=55, loop_sum=45, hello).
  full:
    name: full (LLVM 18 + codegen)
    runs-on: ubuntu-latest
    env:
      # Where llvm-sys / inkwell (llvm18-0) find LLVM 18. Matches the Dockerfile.
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      # Link Rust's own binaries with mold (ticket #128): a fraction of GNU ld's
      # RAM at the link peak and much faster, matching the dev container. Scoped
      # to the Linux target so it only applies here; gcc 12+ drives `-fuse-ld`.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      # Same LLVM 18 toolchain and system libraries llvm-sys links against as
      # .devcontainer/Dockerfile, plus mold (the link-step linker, see env
      # above). (build-essential, curl and git are already on the runner.)
      - name: Install LLVM 18 and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18 \
            llvm-18-dev \
            libpolly-18-dev \
            clang-18 \
            libclang-18-dev \
            libgc-dev \
            libpcre2-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libncurses-dev \
            mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: full

      - name: Format check
        run: cargo fmt --all -- --check

      # Default collector: the precise Immix GC (ticket #116). This is now the
      # primary codegen suite — the same golden end-to-end path plus the
      # GC-specific reclamation tests (tests/gc.rs).
      - name: "Clippy (default: precise Immix GC)"
        run: cargo clippy --workspace --features zapc/gc-immix --all-targets -- -D warnings

      # Fallback collector: the conservative Boehm GC (`-lgc`), kept covered as
      # the secondary suite. Folded into the `full` check so the two-check CI
      # contract (host + full) is unchanged.
      - name: "Clippy (fallback: Boehm GC)"
        run: cargo clippy --workspace --features zapc/gc-boehm --all-targets -- -D warnings

      - name: "Test (default: precise Immix GC)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC)"
        run: cargo test --workspace --features zapc/gc-boehm

  # ARM-Linux (aarch64) validation (ticket #204, platform epic #158 / C2). The
  # same codegen + golden end-to-end suite as `full`, run natively on a GitHub-
  # hosted arm64 runner (no emulation: the runtime's ucontext coroutine switch,
  # SIGURG preemption and epoll netpoller must be exercised on real aarch64
  # hardware, and QEMU-user cannot faithfully emulate swapcontext-from-signal-
  # handler). Both collectors, mirroring `full`. Clippy/fmt stay on x86 (`host`
  # and `full` already gate them; they are target-independent).
  arm64:
    name: arm64 (aarch64 Linux + codegen)
    runs-on: ubuntu-24.04-arm
    env:
      LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-Clink-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      # Fail loudly if the runner label ever silently resolves to x86-64, which
      # would turn this job into a duplicate of `full`.
      - name: Assert aarch64 host
        run: |
          test "$(uname -m)" = aarch64

      - name: Install LLVM 18 and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-18 \
            llvm-18-dev \
            libpolly-18-dev \
            clang-18 \
            libclang-18-dev \
            libgc-dev \
            libpcre2-dev \
            python3-dev \
            pkg-config \
            zlib1g-dev \
            libzstd-dev \
            libffi-dev \
            libedit-dev \
            libxml2-dev \
            libncurses-dev \
            mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64

      - name: "Test (default: precise Immix GC)"
        run: cargo test --workspace --features zapc/gc-immix

      - name: "Test (fallback: Boehm GC)"
        run: cargo test --workspace --features zapc/gc-boehm

  # Windows coroutine context switch (ticket #195, platform epic #158 / Area A1).
  # REQUIRED (no `continue-on-error`): unlike the broader `windows` job below —
  # which stays non-blocking because a full Zap *program* cannot link on Windows
  # until A4 (#198, fs/process/sockets) lands — the A1 context switch itself
  # is complete and verifiable TODAY, in isolation from the unported subsystems.
  # This job builds and runs the standalone verification harness
  # (`crates/codegen/src/zap_ctx_win_x64_test.c`, which pulls in the shipping asm
  # backend `zap_ctx_win_x64.c`) on a native windows-latest runner and asserts:
  #   1. a coroutine switches in/out faithfully across many round-trips,
  #      preserving the full Windows x64 nonvolatile set — callee-saved GPRs AND
  #      XMM6-XMM15 (the Windows delta over System V) — and its own stack; and
  #   2. under the conservative `gc-boehm` collector, a *suspended* coroutine's
  #      heap root (reachable only via a pointer on its green stack and in a
  #      spilled callee-saved register) survives collections that run while it is
  #      parked — the load-bearing GC invariant native Fibers would have broken
  #      (design/0017). This is the on-Windows GC check the spike could not run.
  # The precise `gc-immix` collector cannot be exercised standalone (its roots
  # come from compiler-emitted shadow-stack code and its heap uses mmap, not yet
  # ported to VirtualAlloc); immix's parked-coroutine invariant is proven
  # behavior-neutral through this same seam by the gc-immix goldens on the
  # required Linux/ARM jobs (gc_parked_coroutine, immix_evac_coro_stress, ...).
  windows-ctxswitch:
    name: "Windows coroutine context switch (I#195 / A1)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 / MinGW-w64 is the A5-chosen Windows toolchain (design/0017,0018).
      # Pull in gcc and the thread-aware Boehm GC (`mingw-w64-x86_64-gc`) so the
      # gc-boehm invariant test links `-lgc`. Pinned, no full-system update, to
      # keep the job fast and deterministic.
      - name: Set up MSYS2 / MinGW-w64 + Boehm GC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc

      # (1) Context switch + full nonvolatile (GPR + XMM6-15) + stack preservation.
      # No external deps; pure MinGW gcc. REQUIRED.
      - name: Context switch — control flow + nonvolatile preservation
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall zap_ctx_win_x64_test.c -o ctxtest.exe
          ./ctxtest.exe

      # (2) THE critical A1 GC verification: parked-coroutine heap root survives
      # collection under the conservative Boehm collector. REQUIRED.
      - name: Context switch — gc-boehm parked-coroutine root survival
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall -DZAP_CTX_TEST_BOEHM zap_ctx_win_x64_test.c -lgc -o ctxtest_gc.exe
          ./ctxtest_gc.exe

  # Windows signals / preemption / faults (ticket #197, platform epic #158 /
  # Area A3). REQUIRED (no `continue-on-error`), same rationale as
  # `windows-ctxswitch`: a full Zap *program* cannot link on Windows until A2
  # (#196) and A4 (#198) also compile (zaprt.c is one translation unit), but the
  # A3 MECHANISMS are complete and verifiable TODAY in isolation. This job builds
  # and runs the standalone harness (`zap_win_a3_test.cc`, which pulls in the
  # shipping backends `zap_win_a3.c` + the A1 `zap_ctx_win_x64.c`) on a native
  # windows-latest runner and asserts, under MinGW-w64 (the gc-boehm Windows v1
  # toolchain):
  #   T1. a C++ (SEH) exception is thrown and caught across frames living on a
  #       hand-switched green stack — the critical A1xA3 interaction (SEH consults
  #       the TIB stack bounds the A1 switch installs). g++ lowers try/throw/catch
  #       to exactly the __gxx_personality_seh0 + __cxa_* SEH model Zap codegen now
  #       targets.
  #   T2. the boehm preemption HIJACK (SuspendThread + Get/SetThreadContext) is
  #       control-flow- and register-faithful across many injections.
  #   T3. the bdwgc-STW x monitor SuspendThread race (ticket #197 Q5) is closed by
  #       mutex serialization under heavy stress (no deadlock, no corruption).
  #   T4. the last-chance fault filter reports type/address/coroutine + a dbghelp
  #       backtrace and lets the process die (run in a child, like I#77).
  #   T5. console control events map to the Signal enum's reachable subset.
  # The precise gc-immix collector is not exercised here (its heap needs the
  # mmap->VirtualAlloc port); its flag-at-safepoint preempt path is collector-
  # agnostic and proven behavior-neutral by the gc-immix goldens on Linux/ARM.
  windows-a3:
    name: "Windows signals / preemption / faults (I#197 / A3)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 g++ (C++ for the SEH exception proxy) + the thread-aware Boehm
      # GC is not needed here (the harness uses plain malloc'd green stacks — the
      # GC-ownership invariant is A1's job, covered by windows-ctxswitch); dbghelp
      # ships with MinGW-w64.
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: A3 primitives — SEH/green-stack, hijack, Q5 stress, fault, signals
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          g++ -O2 -Wall zap_win_a3_test.cc -ldbghelp -o a3test.exe
          ./a3test.exe

  # Windows IOCP netpoller backend (ticket #196, platform epic #158 / Area A2).
  # REQUIRED (no `continue-on-error`), same rationale as `windows-ctxswitch` /
  # `windows-a3`: a full Zap *program* cannot link on Windows until A4 (#198) also
  # compiles (zaprt.c is one translation unit), but the A2 MECHANISM is complete and
  # verifiable TODAY in isolation. This job builds and runs the standalone harness
  # (`zap_np_iocp_test.c`, which links the shipping backend `zap_np_iocp.c`) on a
  # native windows-latest runner under MinGW-w64 and asserts, over a raw-Winsock
  # loopback socket pair (NOT the Zap net module — A4 is out of A2 scope):
  #   T1. an armed AFD READ poll times out while the socket is not readable and
  #       completes (right userkey + readable) once the peer sends — the
  #       IOCP-completion -> readiness bridge the design rests on.
  #   T2. the park/wake round-trip: a waiter parked on a condvar is woken by a
  #       completion the real zap_iocp_wait poller loop delivers (the copark/coready
  #       analogue).
  #   T3. the PostQueuedCompletionStatus kick (`zap_iocp_kick`) promptly unblocks a
  #       poller parked in zap_iocp_wait (the eventfd/self-pipe-kick equivalent).
  #   T4. tearing down a descriptor with an in-flight poll (CancelIoEx) and reaping
  #       the cancelled completion does not leak or crash.
  # The precise gc-immix collector is not exercised here (its heap needs the
  # mmap->VirtualAlloc port); the netpoller is collector-agnostic and its full
  # copark/coready + latch + deadline logic is proven behavior-neutral by the
  # `netpoller.zap` golden on the required Linux/ARM jobs under both collectors.
  windows-netpoller:
    name: "Windows IOCP netpoller (I#196 / A2)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW-w64 gcc only: the harness needs Winsock (`-lws2_32`, preinstalled)
      # and resolves the ntdll AFD entry points at runtime (no `-lntdll`). The
      # thread-aware Boehm GC is not needed here — the harness uses Win32 threads
      # and the netpoller allocates no GC memory (the GC-ownership invariant is
      # A1's job, covered by `windows-ctxswitch`).
      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: A2 netpoller — AFD readiness, park/wake, kick, teardown
        shell: msys2 {0}
        run: |
          set -eux
          cd crates/codegen/src
          gcc -O2 -Wall zap_np_iocp_test.c zap_np_iocp.c -lws2_32 -o nptest.exe
          ./nptest.exe

  # Windows bring-up (ticket #199, platform epic #158 / Area A5). NON-BLOCKING by
  # design (`continue-on-error: true`): the Windows runtime port is incomplete —
  # the A1 coroutine context switch (#195), the A3 signals/preemption/faults +
  # SEH exception mechanisms (#197), and the A2 IOCP netpoller (#196) now land (see
  # the required `windows-ctxswitch`, `windows-a3`, and `windows-netpoller` jobs
  # above), but the C runtime (`crates/codegen/src/
  # zaprt.c`) is a single translation unit and still needs A4 (#198
  # fs/process/random/sockets) to compile before a Zap *program* can link and run
  # on Windows (the runtime's platform gate fails that compile with the exact gap
  # map). This job therefore
  # validates the stage that DOES pass today — the portable compiler front-end
  # crates (default members, no LLVM) build and test on a native Windows host —
  # and records the MinGW-w64 link toolchain A5 targets. It reports progress
  # WITHOUT blocking merges; the Linux `host`/`full` and `arm64` jobs stay
  # required and unchanged. Promote this to a required full-codegen+link job once
  # A4 lands. (Clippy/fmt stay on x86 — `host`/`full` already gate them and
  # they are target-independent, matching the `arm64` job.)
  windows:
    name: "Windows (in progress, A4 pending)"
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt

      # MinGW-w64 is the A5-chosen Windows toolchain (its `gcc`/`cc` provides the
      # `x86_64-pc-windows-gnu` target, with `winpthreads` + `libstdc++`,
      # minimising the Itanium->SEH exception-ABI change vs MSVC — see
      # design/0017-windows-coroutine-context-switch.md). It is preinstalled on
      # `windows-latest`; print the version so the link toolchain the driver
      # (crates/codegen/src/lib.rs) targets is visible in the log. The runtime
      # libraries (pcre2/zlib/openssl/boehm-gc via MSYS2 `mingw-w64-x86_64-*`) are
      # only needed when `zaprt.c` compiles, which is gated on A1/A3 and so not
      # exercised here.
      - name: Show MinGW-w64 toolchain
        shell: bash
        run: |
          gcc --version || echo "gcc (MinGW-w64) not on PATH"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      # Portable front-end crates (syntax/sema/ir/mono/pkg/driver): no LLVM, no
      # C runtime link, so these exercise Windows portability of the Rust side
      # (and the new target-aware link code is type-checked by the Linux `full`
      # job, which compiles the Windows arm even though it does not take it).
      - name: Build (default members, no LLVM)
        run: cargo build

      # Best-effort, NON-FATAL (`continue-on-error` on the step): the build above
      # is the stage that passes and gates this job; the tests are run only to
      # surface A4 (#198) path/fs/process assumptions in the portable crates as a
      # visible signal without turning the check red. Known failure today:
      # `driver::zap_cli::zenv_create_and_resolution_flip` asserts a `/`-joined
      # cache path, but `Path::join` yields `\` on Windows — an A4 path-separator
      # item, not an A5 toolchain bug. Drop `continue-on-error` here once A4 lands.
      - name: Test (default members, no LLVM)
        continue-on-error: true
        run: cargo test
