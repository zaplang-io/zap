# Build and publish the prebuilt Zap toolchain image to GHCR.
#
# This is SEPARATE from ci.yml and intentionally OFF the required `CI gate`
# path (publishing is not a PR gate). It:
#   * on pull requests that touch the image definition — builds the image and
#     runs the smoke test, WITHOUT pushing (validation only);
#   * on pushes to `main` — builds, smoke-tests, and publishes `latest` + a
#     `sha-<short>` tag;
#   * on release tags `v*` — publishes the `X.Y.Z` and `X.Y` version tags.
#
# The containerized companion to the release process (docs/RELEASING.md, I#207)
# and the prebuilt-artifact track (I#208). See docs/DOCKER.md.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # Only rebuild on PRs that change what goes INTO the image — building the
    # LLVM-linked toolchain is expensive, so normal code PRs don't trigger it
    # (ci.yml already builds + tests the toolchain). main pushes and v* tags
    # always build.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "scripts/docker-smoke.sh"
  workflow_dispatch:

# Least privilege: read the repo, write packages (GHCR). `packages: write` is
# only exercised on the push/tag paths (guarded below); PRs never push.
permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/zaplang-io/zap

jobs:
  image:
    name: Build image${{ github.event_name == 'pull_request' && ' (validate)' || ' + publish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Only log in when we will actually push (main / tags). PRs — including
      # from forks, where GITHUB_TOKEN has no packages:write — skip this.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # `latest` + the commit sha on the default branch.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            # `X.Y.Z` and `X.Y` on a v* release tag (strips the leading `v`).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once and load into the local daemon so the smoke test runs against
      # the exact image. Uses GitHub Actions layer cache so the expensive LLVM
      # build is reused across runs.
      - name: Build image (load for smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: zap-local:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the slim image can compile, link, run and test a Zap program.
      - name: Smoke test the image
        run: scripts/docker-smoke.sh zap-local:smoke

      # Publish only on main / tags. Fully cache-hits the build above, so this
      # re-tags and pushes rather than rebuilding.
      - name: Build and push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
