# Build and publish the Zap CI toolchain base image to GHCR (issue #854).
#
# This image is the build environment the Linux `full` CI leg will run INSIDE
# (`container: ghcr.io/zaplang-io/zap-ci:latest`), so that leg no longer installs
# LLVM 18 + the C deps from third-party mirrors on every job — the dominant CI
# hang source. The image + this workflow land first; the `ci.yml` `full`-leg flip
# is a fast-follow, because a `container:` job can only pull an image that is
# already published (see CI_DOCKER_IMAGES/README.md → Rollout).
#
# This workflow is SEPARATE from ci.yml and OFF the required `CI gate`
# (publishing an image is not a PR gate). It is PATH-SCOPED: it triggers only
# when the image definition changes, so it never burns action minutes on
# unrelated PRs. It:
#   * on PRs that touch CI_DOCKER_IMAGES/** — builds + smoke-tests the image,
#     WITHOUT pushing (validation only);
#   * on pushes to `main` — builds, smoke-tests, and publishes `latest` + a
#     `sha-<short>` provenance tag.
#
# NOTE: this is DISTINCT from docker.yml, which publishes the slim *runtime*
# image ghcr.io/zaplang-io/zap (#277) for downstream repos to run `zap test`.
name: CI toolchain image

on:
  push:
    branches: [main]
    # Only (re)build + publish when what goes INTO the image changes.
    paths:
      - "CI_DOCKER_IMAGES/**"
      - ".github/workflows/ci-image.yml"
  pull_request:
    # Validate the Dockerfile only on PRs that touch it — building the
    # LLVM-linked toolchain is expensive, so normal code PRs never trigger it.
    paths:
      - "CI_DOCKER_IMAGES/**"
      - ".github/workflows/ci-image.yml"
  workflow_dispatch:

# Least privilege: read the repo, write packages (GHCR). `packages: write` is
# only exercised on the push path (guarded below); PRs never push.
permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/zaplang-io/zap-ci

jobs:
  image:
    name: Build CI image${{ github.event_name == 'pull_request' && ' (validate)' || ' + publish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Only log in when we will actually push (main). PRs — including from
      # forks, where GITHUB_TOKEN has no packages:write — skip this.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # `latest` + a `sha-<short>` provenance tag on the default branch.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      # Build once and load into the local daemon so the smoke test runs against
      # the exact image. GitHub Actions layer cache reuses the expensive LLVM +
      # Rust layers across runs.
      - name: Build image (load for smoke test)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: CI_DOCKER_IMAGES
          load: true
          tags: zap-ci-local:smoke
          cache-from: type=gha,scope=zap-ci
          cache-to: type=gha,mode=max,scope=zap-ci

      # Prove the baked toolchain is present and coherent: Rust (+ clippy),
      # clang-18 / llvm-config at the 18.1 series, Node, git, and that
      # LLVM_SYS_180_PREFIX points at a real LLVM 18.
      - name: Smoke test the image
        run: |
          set -euxo pipefail
          run() { docker run --rm zap-ci-local:smoke bash -lc "$1"; }
          run 'rustc --version'
          run 'cargo --version'
          run 'cargo clippy --version'
          run 'test "$(/usr/lib/llvm-18/bin/llvm-config --version | cut -d. -f1-2)" = "18.1"'
          run 'clang-18 --version'
          run '/usr/lib/llvm-18/bin/ld.lld --version'
          run 'mold --version'
          run 'node --version'
          run 'git --version'
          run 'test -x "$LLVM_SYS_180_PREFIX/bin/llvm-config"'

      # Publish only on main. Fully cache-hits the build above, so this re-tags
      # and pushes rather than rebuilding.
      - name: Build and push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: CI_DOCKER_IMAGES
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zap-ci
          cache-to: type=gha,mode=max,scope=zap-ci
